aid: yieldstreet
name: Willow Wealth
description: >-
  Willow Wealth Inc. - formerly Yieldstreet - is a New York City financial technology
  company that operates an online private-markets investing platform, giving accredited
  and retail investors access to alternative asset classes including real estate, private
  credit, private equity, art, legal finance, and third-party evergreen funds from
  institutional managers. Founded in 2015 by Milind Mehere and Michael Weisz, the platform
  reports more than 500,000 members and over $6 billion in cumulative investments, and
  renamed itself Willow Wealth in late 2025. Investors reach it through a web portal and
  iOS/Android apps; the company publishes no public developer program, API reference, or
  machine-readable specification.
